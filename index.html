<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard de Agendamentos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<link rel="icon" type="image/svg+xml" href="https://cdn-icons-png.flaticon.com/512/2409/2409635.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
:root{--bg:#0f1117;--bg2:#181c26;--bg3:#1f2433;--bd:rgba(255,255,255,0.07);--bd2:rgba(255,255,255,0.14);--t1:#fff;--t2:#d0d4e0;--t3:#9098b0;--green:#2dd4a0;--gdim:rgba(45,212,160,.13);--blue:#5b9cf6;--bdim:rgba(91,156,246,.13);--orange:#fb923c;--odim:rgba(251,146,60,.13);--purple:#c4b5fd;--pdim:rgba(196,181,253,.13);--amber:#fcd34d;--adim:rgba(252,211,77,.12);--pink:#f472b6;--pkdim:rgba(244,114,182,.13);--teal:#2dd4bf;--tdim:rgba(45,212,191,.13);--red:#f87171;--rdim:rgba(248,113,113,.14);--sky:#38bdf8;--skdim:rgba(56,189,248,.14);--indigo:#a5b4fc;--idim:rgba(165,180,252,.14);--lime:#a3e635;--ldim:rgba(163,230,53,.14);--r:10px;--rs:6px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--t1);font-family:'DM Sans',sans-serif;min-height:100vh}
.app{display:grid;grid-template-rows:auto 1fr;min-height:100vh}
.header{background:var(--bg2);border-bottom:1px solid var(--bd);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.hleft{display:flex;align-items:center;gap:12px}
.hright{display:flex;align-items:center;gap:10px}
.hicon{width:36px;height:36px;background:var(--gdim);border-radius:var(--rs);display:flex;align-items:center;justify-content:center;color:var(--green);font-size:18px}
.header h1{font-size:15px;font-weight:600;letter-spacing:-.01em}
.header p{font-size:12px;color:var(--t2);margin-top:1px}
.badge{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--green);background:var(--gdim);padding:4px 10px;border-radius:20px}
.badge.err{color:var(--red);background:var(--rdim)}
.badge.err .dot{background:var(--red)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0}
#lupd{font-size:11px;color:var(--t3)}
.rbtn{background:var(--bg3);border:1px solid var(--bd2);color:var(--t2);border-radius:var(--rs);padding:4px 8px;cursor:pointer;font-size:13px;display:flex;align-items:center}
.rbtn:hover{color:var(--t1)}
.rbtn.spin i{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.content{display:grid;grid-template-columns:280px 1fr;height:calc(100vh - 65px);overflow:hidden}
.sidebar{background:var(--bg2);border-right:1px solid var(--bd);display:flex;flex-direction:column;overflow-y:auto}
.sbs{padding:16px;border-bottom:1px solid var(--bd)}
.sbl{font-size:10px;font-weight:600;color:#fff;text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
.mpills{display:flex;flex-direction:column;gap:2px}
.mpill{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:var(--rs);cursor:pointer;border:none;background:transparent;color:var(--t2);font-family:'DM Sans',sans-serif;font-size:13px;width:100%;text-align:left;transition:background .15s}
.mpill:hover{background:var(--bg3);color:var(--t1)}
.mpill.active{background:var(--gdim);color:var(--green);font-weight:500}
.mcnt{font-size:10px;background:var(--bg3);padding:2px 6px;border-radius:10px;color:var(--t3);font-family:'DM Mono',monospace}
.mpill.active .mcnt{background:rgba(45,212,160,.2);color:var(--green)}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.ch{font-size:9px;font-weight:600;color:var(--t3);text-align:center;padding:3px 0;text-transform:uppercase}
.cd{font-size:11px;text-align:center;padding:5px 2px;border-radius:4px;cursor:pointer;color:var(--t3);line-height:1;font-family:'DM Mono',monospace;border:none;background:transparent;width:100%;transition:background .15s}
.cd.om{opacity:0;pointer-events:none}
.cd.hd{color:var(--t2)}
.cd.hd::after{content:'';display:block;width:3px;height:3px;border-radius:50%;background:var(--green);margin:2px auto 0;opacity:.6}
.cd:hover:not(.om){background:var(--bg3);color:var(--t1)}
.cd.sel{background:var(--green)!important;color:#071a12!important;font-weight:600}
.cd.sel::after{display:none}
.cd.tod{color:var(--blue)}
.main{overflow-y:auto;padding:20px;background:var(--bg);display:flex;flex-direction:column;gap:16px}
.dnav{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.dtitle{font-size:20px;font-weight:600;letter-spacing:-.02em}
.dsub{font-size:12px;color:var(--t2);margin-top:2px}
.dnav-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.navbtns{display:flex;gap:6px}
.nbtn{background:var(--bg2);border:1px solid var(--bd2);color:var(--t2);border-radius:var(--rs);padding:6px 12px;cursor:pointer;font-size:13px;transition:all .15s;font-family:'DM Sans',sans-serif}
.nbtn:hover{background:var(--bg3);color:var(--t1)}
.filter-bar{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.fbtn{background:var(--bg3);border:1px solid var(--bd);color:var(--t3);border-radius:20px;padding:4px 11px;cursor:pointer;font-size:11px;font-weight:500;font-family:'DM Sans',sans-serif;transition:all .15s;white-space:nowrap}
.fbtn:hover{color:var(--t1);border-color:var(--bd2)}
.fbtn.active{background:var(--bdim);border-color:var(--blue);color:var(--blue)}
.fbtn.fall.active{background:var(--gdim);border-color:var(--green);color:var(--green)}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.metric{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);padding:14px 16px}
.mlbl{font-size:11px;color:var(--t2);display:flex;align-items:center;gap:5px;margin-bottom:8px}
.mval{font-size:32px;font-weight:600;letter-spacing:-.03em;line-height:1;font-family:'DM Mono',monospace}
.msub{font-size:10px;color:var(--t3);margin-top:4px}
.mg .mval{color:var(--green)}.mb .mval{color:var(--blue)}.mo .mval{color:var(--orange)}.mp .mval{color:var(--purple)}
.card{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);padding:16px}
.chd{font-size:10px;font-weight:600;color:#fff;text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.chd i{font-size:14px}
.tl{display:flex;flex-direction:column;gap:6px}
.slot{display:grid;grid-template-columns:130px 3px 1fr auto;gap:10px;align-items:center;padding:9px 10px;border-radius:var(--rs);border:1px solid var(--bd);transition:border-color .15s;position:relative}
.slot:hover .stip{display:block}
.stip{display:none;position:absolute;bottom:calc(100% + 6px);left:56px;background:#2a2f40;border:1px solid var(--bd2);border-radius:var(--rs);padding:8px 10px;font-size:11px;color:var(--t2);line-height:1.5;width:260px;z-index:100;box-shadow:0 4px 16px rgba(0,0,0,.4);pointer-events:none}
.stip strong{color:#fff;display:block;margin-bottom:3px;font-size:11px}
.slot:hover{border-color:var(--bd2);background:var(--bg3)}
.stime{font-size:11px;font-weight:500;color:var(--t3);font-family:'DM Mono',monospace;display:flex;align-items:center;gap:6px;white-space:nowrap}
.speri{display:inline-flex;gap:3px;font-size:13px}
.speri .ti-sunrise{color:#fcd34d}
.speri .ti-sun{color:#fb923c}
.speri .ti-moon{color:#c4b5fd}
.sbar{width:3px;border-radius:2px;align-self:stretch;min-height:28px}
.scurso{font-size:12px;font-weight:500;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
.stags{display:flex;gap:3px;margin-top:3px;flex-wrap:wrap}
.tag{font-size:10px;padding:2px 6px;border-radius:10px;font-weight:500;display:inline-flex;align-items:center;gap:2px}
.tag i{font-size:10px}
.tnb{background:var(--gdim);color:var(--green)}
.ttv{background:var(--bdim);color:var(--blue)}
.ttr{background:var(--odim);color:var(--orange)}
.tcam{background:var(--pkdim);color:var(--pink)}
.tmic{background:var(--pdim);color:var(--purple)}
.tmon{background:var(--tdim);color:var(--teal)}
.toth{background:rgba(255,255,255,.07);color:var(--t2)}
.tsom{background:var(--idim);color:var(--indigo)}
.tpod{background:var(--ldim);color:var(--lime)}
.ttx{background:var(--rdim);color:var(--red)}
.trx{background:var(--skdim);color:var(--sky)}
.twarn{background:var(--adim);color:var(--amber)}
.tloc{background:var(--adim);color:var(--amber);font-size:9px;padding:1px 4px;border-radius:4px}
.ssala{font-size:10px;color:#fff;text-align:right;min-width:80px;max-width:160px;font-family:'DM Mono',monospace;padding-left:6px;line-height:1.35}
/* Salas */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:8px}
.sc{background:var(--bg3);border:1px solid var(--bd);border-radius:var(--rs);padding:10px 12px;position:relative;cursor:default}
.sc.tr{border-top:2px solid rgba(251,146,60,.3)}
.sname{font-size:12px;font-weight:600;color:#fff;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srec{font-size:10px;color:var(--t2);display:flex;align-items:center;gap:4px;margin-bottom:3px}
.srec i{font-size:11px}
.srec strong{color:#fff}
.sloc{font-size:9px;background:var(--adim);color:var(--amber);padding:1px 4px;border-radius:4px;margin-left:2px}
.scl{font-size:9px;color:#fff;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:'DM Mono',monospace}
.sunit{font-size:9px;color:var(--blue);margin-top:2px;font-family:'DM Mono',monospace}
.sc:hover .tip{display:block}
.tip{display:none;position:absolute;bottom:calc(100% + 6px);left:0;background:#2a2f40;border:1px solid var(--bd2);border-radius:var(--rs);padding:8px 10px;font-size:11px;color:var(--t2);line-height:1.5;width:230px;z-index:100;box-shadow:0 4px 16px rgba(0,0,0,.4);pointer-events:none}
.tip strong{color:#fff;display:block;margin-bottom:3px;font-size:11px}
/* Zoom / Meet */
.zpanel{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);padding:16px}
.zpanel-hd{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.tab-bar{display:flex;gap:2px;background:var(--bg3);border-radius:var(--rs);padding:3px;width:fit-content}
.tbtn{background:transparent;border:none;color:var(--t3);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;padding:6px 14px;border-radius:5px;cursor:pointer;transition:all .15s}
.tbtn:hover{color:var(--t1)}
.tbtn.active{background:var(--bg2);color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.zgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.zcard{background:var(--bg3);border:1px solid var(--bd);border-radius:var(--rs);padding:10px 13px;display:flex;flex-direction:column;gap:5px;min-width:0}
.zcard.active{border-color:rgba(91,156,246,.4);background:rgba(91,156,246,.07);min-width:0}
.zcard.inactive{opacity:.45;min-width:0}
.zcard.meet.active{border-color:rgba(45,212,160,.4);background:rgba(45,212,160,.06)}
.zcard.meet .zname i,.zcard.meet .zatag .zasala i{color:var(--green)}
.zcard.meet .zbadge{background:var(--gdim);color:var(--green)}
.zcard.meet .zatag{background:rgba(45,212,160,.1);color:var(--green)}
.zcard.meet .zalink{color:var(--green)}
.acard.meet .aname i{color:var(--green)}
.zname{font-size:12px;font-weight:700;color:#fff;display:flex;align-items:center;gap:5px}
.zname i{color:var(--blue);font-size:13px}
.zbadge{font-size:9px;background:var(--bdim);color:var(--blue);padding:2px 6px;border-radius:8px;font-weight:600;margin-left:auto}
.zrow{font-size:10px;color:var(--t2);display:flex;align-items:center;gap:5px;overflow:hidden}
.zrow i{font-size:11px;flex-shrink:0;color:var(--t3)}
.zrow strong{color:#fff;font-weight:500}
.zmono{font-family:'DM Mono',monospace;letter-spacing:.04em}
.zaulas{margin-top:5px;display:flex;flex-direction:column;gap:4px;min-width:0}
.zatag .zacurso{color:var(--t2);font-family:'DM Mono',monospace;font-size:9.5px}
.zatag{display:flex;flex-direction:column;gap:1px;font-size:10px;line-height:1.35;background:rgba(91,156,246,.12);color:var(--blue);padding:5px 8px;border-radius:6px;white-space:normal;overflow-wrap:anywhere;min-width:0}
.zatag .zasala{font-weight:600;color:#fff;display:flex;align-items:center;gap:4px}
.zatag .zasala i{font-size:11px;color:var(--blue);flex-shrink:0}
.zalink{font-size:10px;color:var(--blue);display:inline-flex;align-items:center;gap:4px;margin-top:4px;text-decoration:none;width:fit-content}
.zalink:hover{color:#fff;text-decoration:underline}
.zalink i{font-size:11px}
.zalink.off{color:var(--t3);cursor:default}
.zalink.off:hover{color:var(--t3);text-decoration:none}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.acard{background:var(--bg3);border:1px solid var(--bd);border-radius:var(--rs);padding:12px 14px;display:flex;flex-direction:column;gap:5px}
.aname{font-size:13px;font-weight:700;color:#fff;display:flex;align-items:center;gap:6px}
.aname i{color:var(--blue);font-size:15px}
.arow{font-size:11px;color:var(--t2);display:flex;align-items:center;gap:6px}
.arow i{font-size:12px;color:var(--t3);flex-shrink:0}
.arow strong{color:#fff;font-weight:500}
.cpbtn{margin-left:auto;background:var(--bg2);border:1px solid var(--bd2);color:var(--t3);border-radius:4px;padding:2px 7px;font-size:10px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;flex-shrink:0}
.cpbtn:hover{color:#fff;border-color:var(--t2)}
.cpbtn.copied{color:var(--green);border-color:var(--green)}
.empty{text-align:center;padding:32px 16px;color:var(--t3);font-size:13px}
.empty i{font-size:28px;display:block;margin-bottom:8px}
.empty.err{color:var(--red)}
.empty small{display:block;margin-top:6px;color:var(--t3);font-size:11px}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:4px}

/* ===== Responsivo ===== */
.main{min-width:0}
.arow strong,.zrow strong{min-width:0;overflow-wrap:anywhere}
@media(max-width:900px){
  .content{display:block;height:auto;overflow:visible}
  .sidebar{flex-direction:column;max-height:none;overflow:visible;border-right:none;border-bottom:1px solid var(--bd)}
  .sbs{border-right:none;min-width:0}
  .mpills{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
  .mpill{width:auto;flex-shrink:0;white-space:nowrap;gap:8px}
  .cgrid{max-width:340px}
  .main{overflow:visible;padding:14px}
  .metrics{grid-template-columns:repeat(2,1fr)}
  .dnav-right{align-items:flex-start;width:100%}
  .filter-bar{justify-content:flex-start}
}
@media(max-width:600px){
  .header{padding:12px 14px}
  .dtitle{font-size:17px}
  .metric{padding:12px}
  .mval{font-size:26px}
  .card,.zpanel{padding:12px}
  .slot{grid-template-columns:3px 1fr;gap:4px 10px}
  .slot .sbar{grid-column:1;grid-row:1 / span 3}
  .slot .stime{grid-column:2;grid-row:1}
  .slot .sbar + div{grid-column:2;grid-row:2;min-width:0}
  .slot .ssala{grid-column:2;grid-row:3;text-align:left;max-width:none;min-width:0;padding-left:0}
  .scurso{white-space:normal;max-width:none}
  .stip,.tip{left:0;right:0;width:auto}
  .sgrid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .zgrid,.agrid{grid-template-columns:1fr}
  .tbtn{padding:6px 10px}
}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="hleft">
      <div class="hicon"><i class="ti ti-calendar-event"></i></div>
      <div><h1>Dashboard de Agendamentos</h1><p>Agendamento de Recursos Extras — Aulas</p></div>
    </div>
    <div class="hright">
      <span id="lupd">Carregando…</span>
      <button class="rbtn" id="rbtn" onclick="loadData(false)" title="Recarregar da planilha"><i class="ti ti-refresh"></i></button>
      <div class="badge" id="livebadge"><span class="dot"></span><span id="livetxt">Ao vivo</span></div>
    </div>
  </header>
  <div class="content">
    <aside class="sidebar">
      <div class="sbs"><div class="sbl">Mês</div><div class="mpills" id="mpills"></div></div>
      <div class="sbs"><div class="sbl">Calendário</div><div class="cgrid" id="cgrid"></div></div>
    </aside>
    <main class="main">
      <div class="dnav">
        <div><div class="dtitle" id="dtitle">—</div><div class="dsub" id="dsub"></div></div>
        <div class="dnav-right">
          <div class="navbtns">
            <button class="nbtn" onclick="changeDay(-1)"><i class="ti ti-chevron-left"></i></button>
            <button class="nbtn" onclick="goToday()">Hoje</button>
            <button class="nbtn" onclick="changeDay(1)"><i class="ti ti-chevron-right"></i></button>
          </div>
          <div class="filter-bar">
            <button class="fbtn fall active" onclick="setFilter('Todos')">Todos</button>
            <button class="fbtn" onclick="setFilter('Prédio 1')">Prédio 1</button>
            <button class="fbtn" onclick="setFilter('Prédio 2')">Prédio 2</button>
            <button class="fbtn" onclick="setFilter('Prédio 3')">Prédio 3</button>
            <button class="fbtn" onclick="setFilter('EAD')">EAD</button>
            <button class="fbtn" onclick="setFilter('Recife')">Recife</button>
          </div>
        </div>
      </div>
      <div class="metrics" id="metrics"></div>
      <div class="card"><div class="chd"><i class="ti ti-clock"></i>Linha do tempo — horários de início</div><div class="tl" id="tl"><div class="empty"><i class="ti ti-loader-2"></i>Carregando agendamentos da planilha…</div></div></div>
      <div class="card"><div class="chd"><i class="ti ti-door"></i>Salas e recursos do dia</div><div class="sgrid" id="sgrid"></div></div>
      <div class="zpanel">
        <div class="zpanel-hd">
          <div class="chd" style="margin-bottom:0"><i class="ti ti-brand-zoom"></i>Contas Zoom</div>
          <div class="tab-bar">
            <button class="tbtn active" id="tab-day" onclick="switchTab('day')"><i class="ti ti-calendar-event" style="font-size:11px;margin-right:4px"></i>Em uso hoje</button>
            <button class="tbtn" id="tab-all" onclick="switchTab('all')"><i class="ti ti-list" style="font-size:11px;margin-right:4px"></i>Todas as contas</button>
          </div>
        </div>
        <div id="zgrid" class="zgrid"></div>
        <div id="zall" style="display:none"></div>
      </div>

      <div class="zpanel">
        <div class="zpanel-hd">
          <div class="chd" style="margin-bottom:0"><i class="ti ti-brand-google"></i>Contas Google Meet</div>
          <div class="tab-bar">
            <button class="tbtn active" id="mtab-day" onclick="switchTabMeet('day')"><i class="ti ti-calendar-event" style="font-size:11px;margin-right:4px"></i>Em uso hoje</button>
            <button class="tbtn" id="mtab-all" onclick="switchTabMeet('all')"><i class="ti ti-list" style="font-size:11px;margin-right:4px"></i>Todas as contas</button>
          </div>
        </div>
        <div id="mgrid" class="zgrid"></div>
        <div id="mall" style="display:none"></div>
      </div>
    </main>
  </div>
</div>
<script>
// ════════════════════════════════════════════════════════════════════════════
// FONTE DOS DADOS: Google Sheets publicado como CSV
// Colunas (nesta ordem): Data | Sala | Curso | Horário | Recurso | Qtd | Locado |
//                        Conta | ID Reunião | Observação | Unidade | Link | Ativo
// • Data: dd/mm/aaaa (ou aaaa-mm-dd)
// • Ativo: só entram linhas marcadas (TRUE). Desmarcou = some do dashboard.
// • Linhas sem Data são ignoradas.
// ════════════════════════════════════════════════════════════════════════════

// ── Leitura da planilha ────────────────────────────────────────────────────
function truthy(v){
  const s=String(v==null?'':v).trim().toLowerCase();
  return ['true','verdadeiro','1','sim','s','x','yes'].indexOf(s)>=0;
}
function toISO(v){
  const s=String(v==null?'':v).trim();
  if(!s)return '';
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m)return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if(m){let y=m[3]; if(y.length===2)y='20'+y; return y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');}
  return '';
}
function rowsFromCSV(txt){
  const rows=Papa.parse(txt,{skipEmptyLines:true}).data;
  if(!rows.length)return [];
  const head=rows[0].map(function(h){return String(h).trim().toLowerCase();});
  const iAtivo=head.indexOf('ativo');
  const out=[];
  for(const r of rows.slice(1)){
    const g=function(i){return String(r[i]==null?'':r[i]).trim();};
    const d=toISO(r[0]);
    if(!d)continue;                                         // linha vazia
    if(iAtivo>=0 && g(iAtivo)!=='' && !truthy(g(iAtivo)))continue; // desmarcada
    const qtd=Number(g(5).replace(',','.'));
    out.push([
      d, g(1), g(2), g(3), g(4),
      isNaN(qtd)||g(5)===''?1:qtd,
      truthy(g(6))?1:0,
      g(7), g(8), g(9), g(10), g(11)
    ]);
  }
  return out;
}
function buildIndex(){
  byDate={}; availYMs={};
  for(const r of DATA){
    const d=r[0], ym=d.slice(0,7);
    if(!byDate[d])byDate[d]=[];
    byDate[d].push(r);
    availYMs[ym]=(availYMs[ym]||0)+1;
  }
}
function setStatus(ok,msg){
  document.getElementById('livebadge').classList.toggle('err',!ok);
  document.getElementById('livetxt').textContent=ok?'Ao vivo':'Sem conexão';

}
function hhmm(d){return d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});}

async function loadData(first){
  if(loading)return;
  loading=true;
  const btn=document.getElementById('rbtn'); btn.classList.add('spin');
  try{
    const res=await fetch(SHEET_CSV+'&t='+Date.now(),{cache:'no-store'});
    if(!res.ok)throw new Error('HTTP '+res.status);
    const txt=await res.text();
    if(txt.trim().charAt(0)==='<')throw new Error('A planilha não devolveu CSV');
    DATA=rowsFromCSV(txt);
    buildIndex();
    lastSync=new Date();
    if(first)pickInitialDate();
    renderAll();
    setStatus(true,'Sincronizado às '+hhmm(lastSync)+' \u2014 '+DATA.length+' linhas');
  }catch(err){
    console.error('Erro ao carregar planilha:',err);
    if(!lastSync){
      document.getElementById('tl').innerHTML='<div class="empty err"><i class="ti ti-cloud-off"></i>Não foi possível carregar a planilha.<small>Confira se ela continua publicada na Web como CSV e tente o botão de recarregar.</small></div>';
      setStatus(false,'Falha ao carregar');
    } else {
      setStatus(false,'Falha ao atualizar \u2014 dados de '+hhmm(lastSync));
    }
  }finally{
    loading=false; btn.classList.remove('spin');
  }
}

  if (r.includes('recebe'))      return {i:'ti-antenna-bars-5', c:'trx', l:rec};
  if (r.includes('transmite')||r.includes('emite')) return {i:'ti-cast', c:'ttx', l:rec};
  if (r.includes('caixa de som')||r.includes('caixa som')) return {i:'ti-device-speaker', c:'tsom', l:'Caixa de Som'};
  if (r.includes('microfone') && (r.includes('bast')||r.includes('de m\u00e3o')||r.includes('de mao'))) return {i:'ti-microphone-2', c:'tmic', l:'Microfone de M\u00e3o'};
  if (r.includes('podcast'))     return {i:'ti-brand-apple-podcast', c:'tpod', l:'Microfone Podcast'};
  if ((r.includes('c\u00e2mera')||r.includes('camera')) && r.includes('trip')) return {i:'ti-video', c:'tcam', l:'C\u00e2mera Trip\u00e9'};
  if (r.includes('notebook'))    return {i:'ti-device-laptop', c:'tnb', l:'Notebook'};
  if (r.includes('tv extra'))    return {i:'ti-device-tv',     c:'ttv', l:'TV Extra'};
  if (r.includes('transmiss'))   return {i:'ti-broadcast',     c:'ttr', l:'Transmiss\u00e3o'};
  if (r.includes('c\u00e2mera')) return {i:'ti-camera',        c:'tcam',l:'C\u00e2mera'};
  if (r.includes('monitor'))     return {i:'ti-device-desktop',c:'tmon',l:'Monitor'};
  if (r.includes('microfone'))   return {i:'ti-microphone',    c:'tmic',l:'Microfone'};
  if (r.includes('focusrite'))   return {i:'ti-music',         c:'tmic',l:'Focusrite'};
  if (r.includes('simman'))      return {i:'ti-stethoscope',   c:'toth',l:'SimMan'};
  if (r.includes('tablet'))      return {i:'ti-device-ipad',   c:'toth',l:'Tablet'};

  return {i:'ti-package',c:'toth',l:rec};
}
// Ícones de período baseado no horário
function periodIcons(timeStr){
  if(!timeStr) return '';
  const matches = timeStr.match(/(\d{1,2}):(\d{2})/g) || [];
  if(!matches.length) return '';
  const times = matches.map(function(t){
    const p = t.split(':').map(Number);
    return p[0]*60 + p[1];
  });
  // manhã < 12:30 | tarde 12:30-18:59 | noite >= 19:00
  const periods = new Set();
  const isRange = timeStr.includes('-') && times.length >= 2;
  if(isRange){
    const start = Math.min.apply(null, times);
    const end   = Math.max.apply(null, times);
    if(start < 750)               periods.add('m');
    if(start < 1140 && end > 750) periods.add('t');
    if(end >= 1140)               periods.add('n');
  } else {
    times.forEach(function(min){
      if(min < 750)       periods.add('m');
      else if(min < 1140) periods.add('t');
      else                periods.add('n');
    });
  }
  const ic = {
    m: '<i class="ti ti-sunrise" title="Manhã"></i>',
    t: '<i class="ti ti-sun"     title="Tarde"></i>',
    n: '<i class="ti ti-moon"    title="Noite"></i>'
  };
  return ['m','t','n'].filter(function(p){return periods.has(p);}).map(function(p){return ic[p];}).join('');
}

function todayISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function roomLabel(predio,sala){
  if(sala==='EAD'||predio==='EAD')return 'EAD';
  return predio+' - '+sala;
}

let selDate=todayISO(), selMonth=selDate.slice(0,7), selFilter='Todos';

function pickInitialDate(){
  selDate=todayISO(); selMonth=selDate.slice(0,7);
  if(!availYMs[selMonth]){const yms=Object.keys(availYMs).sort();selMonth=yms[yms.length-1]||selMonth;}
  if(!byDate[selDate]&&selDate.slice(0,7)!==selMonth){
    const days=Object.keys(byDate).filter(function(d){return d.startsWith(selMonth);}).sort();
    selDate=days[0]||selDate;
  }
}

function filteredRows(){
  const rows=byDate[selDate]||[];
  if(selFilter==='Todos')return rows;
  return rows.filter(function(r){return r[10]===selFilter;});
}

function setFilter(f){
  selFilter=f;
  document.querySelectorAll('.fbtn').forEach(function(b){
    const isFall=b.classList.contains('fall');
    b.classList.toggle('active',(f==='Todos'&&isFall)||(b.textContent.trim()===f&&!isFall));
  });
  renderDay(); renderZoom();
}

function renderAll(){renderPills();renderCal();renderDay();renderZoom();}

function renderPills(){
  document.getElementById('mpills').innerHTML=Object.keys(availYMs).sort().map(function(ym){
    const parts=ym.split('-'), y=parts[0], m=parts[1];
    const days=Object.keys(byDate).filter(function(d){return d.startsWith(ym);}).length;
    return '<button class="mpill '+(ym===selMonth?'active':'')+'" onclick="selMon(\''+ym+'\')">'+MLBL[+m]+' '+y+'<span class="mcnt">'+days+'d</span></button>';
  }).join('');
}

function selMon(ym){
  selMonth=ym;
  const days=Object.keys(byDate).filter(function(d){return d.startsWith(ym);}).sort();
  selDate=days.indexOf(todayISO())>=0?todayISO():(days[0]||ym+'-01');
  renderPills();renderCal();renderDay();renderZoom();
}

function renderCal(){
  const parts=selMonth.split('-'), y=+parts[0], m=+parts[1];
  const dim=new Date(y,m,0).getDate(), fdow=new Date(y,m-1,1).getDay();
  let h=WDAYS.map(function(d){return'<div class="ch">'+d+'</div>';}).join('');
  for(let i=0;i<fdow;i++)h+='<div class="cd om"></div>';
  for(let d=1;d<=dim;d++){
    const iso=y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const hd=!!byDate[iso], isSel=iso===selDate, isT=iso===todayISO();
    let cls='cd';
    if(isSel)cls+=' sel'; else if(hd)cls+=' hd';
    if(isT&&!isSel)cls+=' tod';
    h+='<button class="'+cls+'" onclick="selDay(\''+iso+'\')">'+d+'</button>';
  }
  document.getElementById('cgrid').innerHTML=h;
}

function selDay(iso){
  selDate=iso; const ym=iso.slice(0,7);
  if(ym!==selMonth){selMonth=ym;renderPills();}
  renderCal();renderDay();renderZoom();
}
function changeDay(dir){
  const p=selDate.split('-'), dt=new Date(+p[0],+p[1]-1,+p[2]+dir);
  selDay(dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'));
}
function goToday(){selDay(todayISO());}

function groupSlots(rows){
  const map={};
  for(const r of rows){
    const k=r[1]+'|'+r[2]+'|'+r[3];
    if(!map[k])map[k]={a:r[1],c:r[2],i:r[3],u:r[10],recs:[],descs:{}};
    map[k].recs.push(r);
    if(r[9]&&!map[k].descs[r[2]])map[k].descs[r[2]]=r[9];
  }
  return Object.values(map).sort(function(a,b){return(a.i||'99').localeCompare(b.i||'99');});
}

function renderDay(){
  const rows=filteredRows();
  const p=selDate.split('-'), y=+p[0], m=+p[1], d=+p[2];
  const dow=new Date(y,m-1,d).getDay();
  const flabel=selFilter==='Todos'?'':' \u2014 '+selFilter;
  document.getElementById('dtitle').textContent=d+' de '+MLBL[m]+' de '+y;
  document.getElementById('dsub').textContent=WFULL[dow]+flabel+(rows.length===0?' \u2014 sem agendamentos com recursos':'');

  let nb=0,nbLoc=0,tv=0,tr=0;
  for(const r of rows){
    const rl=r[4].toLowerCase();
    if(rl.includes('notebook') && (rl.includes('locado')||r[6])) nbLoc+=r[5];
    else if(rl.includes('notebook')) nb+=r[5];
    if(rl.includes('tv'))tv+=r[5];
    if(rl.includes('transmiss'))tr++;
  }
  const slots=groupSlots(rows);
  const nbSub=nbLoc>0
    ? '<div class="msub"><span style="color:var(--green)">'+nb+' próprios</span> + <span style="color:var(--amber)">'+nbLoc+' locados</span></div>'
    : '<div class="msub">'+nb+' unidades</div>';
  document.getElementById('metrics').innerHTML=
    '<div class="metric mp"><div class="mlbl"><i class="ti ti-calendar-check"></i>Agendamentos</div><div class="mval">'+slots.length+'</div><div class="msub">com recursos</div></div>'+
    '<div class="metric mg"><div class="mlbl"><i class="ti ti-device-laptop"></i>Notebooks</div><div class="mval">'+(nb+nbLoc)+'</div>'+nbSub+'</div>'+
    '<div class="metric mb"><div class="mlbl"><i class="ti ti-device-tv"></i>TV Extra</div><div class="mval">'+tv+'</div><div class="msub">unidades no dia</div></div>'+
    '<div class="metric mo"><div class="mlbl"><i class="ti ti-broadcast"></i>Transmiss\u00f5es</div><div class="mval">'+tr+'</div><div class="msub">ao vivo</div></div>';

  const tl=document.getElementById('tl');
  if(!slots.length){
    tl.innerHTML='<div class="empty"><i class="ti ti-calendar-off"></i>Nenhum agendamento com recursos neste dia'+(selFilter!=='Todos'?' em '+selFilter:'')+'</div>';
  } else {
    tl.innerHTML=slots.map(function(s,i){
      const col=COLORS[i%COLORS.length];
      const recMap={};
      for(const r of s.recs){
        const k=r[4];
        if(!recMap[k])recMap[k]={qtd:0,locado:false};
        recMap[k].qtd+=r[5];
        if(r[6])recMap[k].locado=true;
      }
      let tags='';
      for(const [rec,v] of Object.entries(recMap)){
        const info=recInfo(rec);
        const locBadge=v.locado?'<span class="tloc">Locado</span>':'';
        const qty=v.qtd>1?' \xd7'+v.qtd:'';
        tags+='<span class="tag '+info.c+'"><i class="ti '+info.i+'"></i>'+esc(info.l)+qty+locBadge+'</span>';
      }
      const descEntries=Object.entries(s.descs||{});
      const stipHtml=descEntries.length?'<div class="stip">'+descEntries.map(function(de){return'<strong>'+esc(de[0])+'</strong>'+esc(de[1]);}).join('<br><br>')+'</div>':'';
      return '<div class="slot">'+stipHtml+'<span class="stime"><span class="speri">'+periodIcons(s.i)+'</span>'+esc(s.i||'\u2014')+'</span><div class="sbar" style="background:'+col+'"></div><div><div class="scurso">'+esc(s.c||'\u2014')+'</div><div class="stags">'+tags+'</div></div><span class="ssala">'+esc(roomLabel(s.u,s.a))+'</span></div>';
    }).join('');
  }

  // Salas — agrupa por sala e soma todos os recursos
  const smap={};
  for(const r of rows){
    const k=r[1];
    if(!smap[k])smap[k]={curso:r[2],recs:{},tr:false,cz:'',it:'',descs:{},unit:r[10]};
    const sd=smap[k], rec=r[4];
    if(!sd.recs[rec])sd.recs[rec]={qtd:0,locado:false};
    sd.recs[rec].qtd+=r[5];
    if(r[6])sd.recs[rec].locado=true;
    if(rec.toLowerCase().includes('transmiss')){
      sd.tr=true;
      if(r[7]&&!sd.cz)sd.cz=r[7];
      if(r[8]&&!sd.it)sd.it=r[8];
      if(r[2])sd.curso=r[2];
    }
    if(r[9]&&!sd.descs[r[2]])sd.descs[r[2]]=r[9];
  }

  const sg=document.getElementById('sgrid');
  const entries=Object.entries(smap).sort(function(a,b){
    const ka=a[1].unit+'|'+a[0], kb=b[1].unit+'|'+b[0];
    const ia=ROOM_ORDER.indexOf(ka), ib=ROOM_ORDER.indexOf(kb);
    if(ia===-1&&ib===-1)return ka.localeCompare(kb);
    if(ia===-1)return 1;
    if(ib===-1)return -1;
    return ia-ib;
  });
  if(!entries.length){sg.innerHTML='<div class="empty">Nenhuma sala com recursos neste dia'+(selFilter!=='Todos'?' em '+selFilter:'')+'</div>';return;}
  sg.innerHTML=entries.map(function(e){
    const sala=e[0], sd=e[1];
    let rec='';
    for(const [r,v] of Object.entries(sd.recs)){
      const info=recInfo(r);
      const locBadge=v.locado?'<span class="sloc">Locado</span>':'';
      const qty=v.qtd>1?': <strong>'+v.qtd+'</strong>':'';
      rec+='<div class="srec"><i class="ti '+info.i+'" style="color:var(--'+
        ({tnb:'green',ttv:'blue',ttr:'orange',tcam:'pink',tmon:'teal',tsom:'indigo',ttx:'red',trx:'sky',twarn:'amber',tpod:'lime'}[info.c]||'purple')+')"></i>'+
        esc(info.l)+qty+locBadge+'</div>';
    }
    if(sd.tr){
      if(sd.cz)rec+='<div class="srec"><i class="ti ti-brand-zoom" style="color:var(--blue)"></i>Conta: <strong>'+esc(sd.cz)+'</strong></div>';
      if(sd.it)rec+='<div class="srec"><i class="ti ti-id-badge-2" style="color:var(--purple)"></i>ID: <strong>'+esc(sd.it)+'</strong></div>';
    }
    const descEntries=Object.entries(sd.descs);
    const tipHtml=descEntries.length?'<div class="tip">'+descEntries.map(function(de){return'<strong>'+esc(de[0])+'</strong>'+esc(de[1]);}).join('<br><br>')+'</div>':'';
    return '<div class="sc'+(sd.tr?' tr':'')+'">'+tipHtml+'<div class="sname">'+esc(roomLabel(sd.unit,sala))+'</div>'+rec+(sd.curso?'<div class="scl">'+esc(sd.curso)+'</div>':'')+'</div>';
  }).join('');
}

// ── Zoom ───────────────────────────────────────────────────────────────────
function renderZoom(){
  const usedMap={};
  for(const r of filteredRows()){
    if(!r[4].toLowerCase().includes('transmiss'))continue;
    const conta=r[7];
    if(!conta||!CONTAS_ZOOM[conta])continue;
    if(!usedMap[conta])usedMap[conta]={aulas:[]};
    const link=(r[11]||'').trim();
    const ex=usedMap[conta].aulas.find(function(x){return x.a===r[1]&&x.c===r[2];});
    if(ex){
      if(!ex.link&&link)ex.link=link;
    } else {
      usedMap[conta].aulas.push({a:r[1],c:r[2],i:r[3],link:link});
    }
  }
  const usedNames=Object.keys(usedMap).sort();
  const unusedNames=Object.keys(CONTAS_ZOOM).filter(function(n){return!usedMap[n];});

  function makeCard(name,info,used,data){
    const aulasHtml=used&&data.aulas.length
      ?'<div class="zaulas">'+data.aulas.map(function(a){
          const lk=a.link
            ?'<a class="zalink" href="'+esc(a.link)+'" target="_blank" rel="noopener"><i class="ti ti-external-link"></i>Entrar na aula</a>'
            :'<span class="zalink off"><i class="ti ti-link-off"></i>Sem link</span>';
          return '<div class="zatag" title="'+esc(a.a)+' \u2014 '+esc(a.c)+'">'+
            '<span class="zasala"><i class="ti ti-door"></i>'+esc(a.a)+'</span>'+
            '<span class="zacurso">'+esc(a.c)+'</span>'+
            (a.i?'<span class="zacurso">'+esc(a.i)+'</span>':'')+
            lk+
          '</div>';
        }).join('')+'</div>'
      :'';
    return '<div class="zcard'+(used?' active':' inactive')+'">'+
      '<div class="zname"><i class="ti ti-brand-zoom"></i>'+esc(name)+(used?'<span class="zbadge">em uso</span>':'')+'</div>'+
      '<div class="zrow"><i class="ti ti-at"></i><strong>'+esc(info.u)+'</strong></div>'+
      '<div class="zrow zmono"><i class="ti ti-lock"></i><strong>'+esc(info.p)+'</strong></div>'+
      aulasHtml+
      '</div>';
  }

  document.getElementById('zgrid').innerHTML=
    (usedNames.length
      ?usedNames.map(function(n){return makeCard(n,CONTAS_ZOOM[n],true,usedMap[n]);}).join('')
      :'<div class="empty" style="padding:16px;text-align:left"><i class="ti ti-video-off" style="font-size:20px;margin-bottom:4px;display:block"></i>Nenhuma transmiss\u00e3o neste dia</div>')
    +unusedNames.map(function(n){return makeCard(n,CONTAS_ZOOM[n],false,{aulas:[]});}).join('');

  renderMeet();
}

// ── Google Meet ────────────────────────────────────────────────────────────
function normKey(s){return String(s||'').replace(/\s+/g,'').toLowerCase();}
function resolveConta(contas,nome){
  const n=normKey(nome);
  return Object.keys(contas).find(function(k){return normKey(k)===n;})||null;
}
function isMeetRow(r){
  return (r[11]||'').includes('meet.google.com')||normKey(r[7]).includes('meet');
}

function renderMeet(){
  const usedMap={};
  for(const r of filteredRows()){
    if(!r[4].toLowerCase().includes('transmiss'))continue;
    if(!isMeetRow(r))continue;
    const conta=resolveConta(CONTAS_MEET,r[7])||(r[7]||'Google Meet').trim();
    if(!usedMap[conta])usedMap[conta]={aulas:[]};
    const link=(r[11]||'').trim(), code=(r[8]||'').trim();
    const ex=usedMap[conta].aulas.find(function(x){return x.a===r[1]&&x.c===r[2];});
    if(ex){
      if(!ex.link&&link)ex.link=link;
      if(!ex.code&&code)ex.code=code;
    } else {
      usedMap[conta].aulas.push({a:r[1],c:r[2],i:r[3],link:link,code:code});
    }
  }
  const usedNames=Object.keys(usedMap).sort();
  const unusedNames=Object.keys(CONTAS_MEET).filter(function(n){return!usedMap[n];});

  function makeCard(name,info,used,data){
    info=info||{u:'',p:''};
    const aulasHtml=used&&data.aulas.length
      ?'<div class="zaulas">'+data.aulas.map(function(a){
          const lk=a.link
            ?'<a class="zalink" href="'+esc(a.link)+'" target="_blank" rel="noopener"><i class="ti ti-external-link"></i>Entrar na aula</a>'
            :'<span class="zalink off"><i class="ti ti-link-off"></i>Sem link</span>';
          return '<div class="zatag" title="'+esc(a.a)+' \u2014 '+esc(a.c)+'">'+
            '<span class="zasala"><i class="ti ti-door"></i>'+esc(a.a)+'</span>'+
            '<span class="zacurso">'+esc(a.c)+'</span>'+
            (a.i?'<span class="zacurso">'+esc(a.i)+'</span>':'')+
            (a.code?'<span class="zacurso">ID: '+esc(a.code)+'</span>':'')+
            lk+
          '</div>';
        }).join('')+'</div>'
      :'';
    return '<div class="zcard meet'+(used?' active':' inactive')+'">'+
      '<div class="zname"><i class="ti ti-brand-google"></i>'+esc(name)+(used?'<span class="zbadge">em uso</span>':'')+'</div>'+
      (info.u?'<div class="zrow"><i class="ti ti-at"></i><strong>'+esc(info.u)+'</strong></div>':'')+
      (info.p?'<div class="zrow zmono"><i class="ti ti-lock"></i><strong>'+esc(info.p)+'</strong></div>':'')+
      aulasHtml+
      '</div>';
  }

  document.getElementById('mgrid').innerHTML=
    (usedNames.length
      ?usedNames.map(function(n){return makeCard(n,CONTAS_MEET[n],true,usedMap[n]);}).join('')
      :'<div class="empty" style="padding:16px;text-align:left"><i class="ti ti-video-off" style="font-size:20px;margin-bottom:4px;display:block"></i>Nenhuma transmiss\u00e3o via Meet neste dia</div>')
    +unusedNames.map(function(n){return makeCard(n,CONTAS_MEET[n],false,{aulas:[]});}).join('');
}

function copyText(text,btn){
  navigator.clipboard.writeText(text).then(function(){
    btn.textContent='copiado!';btn.classList.add('copied');
    setTimeout(function(){btn.textContent='copiar';btn.classList.remove('copied');},1500);
  });
}
